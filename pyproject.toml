[project]
name = "revuer"
version = "0.1.0"
description = "A local daemon with a CLI and a web UI for reviewing code per git worktree and branch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162",
    "pydantic>=2",
    "starlette>=1",
    "typer>=0.27",
    "uvicorn>=0.54",
]

[project.scripts]
revuer = "revuer.cli:app"

[dependency-groups]
dev = [
    "httpx2",
    "import-linter>=2.15",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revuer"]
artifacts = ["src/revuer/static/"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/revuer/static/"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "C4", "RUF", "PT"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_packages = ["revuer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Context cores are pure"
type = "forbidden"
source_modules = ["revuer.config.core"]
forbidden_modules = [
    "fastapi",
    "io",
    "logging",
    "os",
    "revuer.config.loader",
    "shutil",
    "socket",
    "starlette",
    "subprocess",
    "time",
    "typer",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Interfaces use public context APIs"
type = "forbidden"
source_modules = ["revuer.cli", "revuer.web"]
forbidden_modules = ["revuer.config.core", "revuer.config.loader"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Interfaces sit above contexts"
type = "layers"
layers = ["revuer.cli", "revuer.web", "revuer.config"]
